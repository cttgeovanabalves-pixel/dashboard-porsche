<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendas Porsche: painel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F0ED;--panel:#FFFFFF;--ink:#1B1C1E;--mute:#66686B;--line:#DAD8D3;--red:#C8102E;--bar:#2A2C2F;--track:#ECEAE6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--panel:#1D1F21;--ink:#EDECE8;--mute:#9A9C9F;--line:#32353A;--red:#E5374F;--bar:#BDBFC2;--track:#2A2D30}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 48px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.2px}
h1{font-size:clamp(34px,6vw,56px);line-height:1;margin:0 0 6px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;max-width:60ch}
.demo{background:var(--panel);border-left:4px solid var(--red);padding:10px 14px;margin:0 0 18px;font-size:14px}
.demo button,.btn{font:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:22px}
.bar label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
select,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 10px;min-width:140px;border-radius:2px}
.btn:hover,select:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.kpi{background:var(--panel);padding:16px}
.kpi small{color:var(--mute);font-size:13px}
.kpi .num{display:block;font-size:40px;font-weight:700;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);padding:18px}
.card.wide{grid-column:1/-1}
h2{font-size:24px;margin:0 0 2px;font-weight:700}
.ins{color:var(--mute);font-size:14px;margin:0 0 14px;min-height:21px}
.row{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:14px}
.row:hover .lb{text-decoration:underline}
.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{background:var(--track);height:16px}
.fl{height:100%;background:var(--bar)}
.row.top .fl{background:var(--red)}
.val{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:end;gap:10px;height:190px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;cursor:pointer;font-size:12px;gap:4px}
.col i{display:block;width:100%;background:var(--bar);min-height:2px}
.col.top i{background:var(--red)}
.yrs{display:flex;gap:10px;margin-top:6px}
.yrs span{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.empty{padding:30px 0;color:var(--mute)}
footer{margin-top:22px;color:var(--mute);font-size:13px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:100px 1fr 80px}}
</style>
</head>
<body>

  <p class="sub">Onde está a receita, como ela evolui por ano-modelo e como o cliente paga. Clique em uma barra para filtrar.</p>
  <div class="bar" id="filters"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <section class="card wide"><h2>Quais modelos concentram a receita?</h2><p class="ins" id="i1"></p><div id="c1"></div></section>
    <section class="card"><h2>A receita cresce de um ano para o outro?</h2><p class="ins" id="i2"></p><div id="c2"></div></section>
    <section class="card"><h2>Como os clientes pagam?</h2><p class="ins" id="i3"></p><div id="c3"></div></section>
  </div>
  <footer id="foot"></footer>
</div>

,"cidade":"Reno","estado":"NV","ano":2023,"preco":91500.0,"pagamento":"Lease"},{"modelo":"Panamera","versao":"Panamera Turbo S","cidade":"Buffalo","estado":"NY","ano":2022,"preco":134000.0,"pagamento":"Wire Transfer"},{"modelo":"Macan","versao":"Macan GTS","cidade":"Durham","estado":"NC","ano":2024,"preco":96800.0,"pagamento":"ACH Payment"},{"modelo":"Taycan","versao":"Taycan 4S","cidade":"Laredo","estado":"TX","ano":2025,"preco":131600.0,"pagamento":"Wire Transfer"},{"modelo":"Cayenne","versao":"Cayenne E-Hybrid","cidade":"Madison","estado":"WI","ano":2023,"preco":94300.0,"pagamento":"Cash"},{"modelo":"911","versao":"911 Turbo S","cidade":"Lubbock","estado":"TX","ano":2025,"preco":242000.0,"pagamento":"Crypto Payment"},{"modelo":"Macan","versao":"Macan Electric","cidade":"Irvine","estado":"CA","ano":2026,"preco":91300.0,"pagamento":"Wire Transfer"},{"modelo":"Panamera","versao":"Panamera","cidade":"Garland","estado":"TX","ano":2021,"preco":79900.0,"pagamento":"Financing"},{"modelo":"Cayenne","versao":"Cayenne Coupe","cidade":"Irving","estado":"TX","ano":2024,"preco":111000.0,"pagamento":"Bank Transfer"},{"modelo":"911","versao":"911 Targa 4S","cidade":"Chesapeake","estado":"VA","ano":2023,"preco":156500.0,"pagamento":"Cash"},{"modelo":"Taycan","versao":"Taycan","cidade":"Scottsdale","estado":"AZ","ano":2025,"preco":119900.0,"pagamento":"Lease"},{"modelo":"Macan","versao":"Macan T","cidade":"Norfolk","estado":"VA","ano":2022,"preco":73200.0,"pagamento":"Wire Transfer"},{"modelo":"911","versao":"911 GT3","cidade":"Boise","estado":"ID","ano":2024,"preco":224000.0,"pagamento":"Wire Transfer"},{"modelo":"911","versao":"911 Carrera","cidade":"Orlando","estado":"FL","ano":2024,"preco":126900.0,"pagamento":"Credit Card"},{"modelo":"Cayenne","versao":"Cayenne","cidade":"San Jose","estado":"CA","ano":2023,"preco":84500.0,"pagamento":"Bank Transfer"},{"modelo":"Macan","versao":"Macan S","cidade":"Tampa","estado":"FL","ano":2022,"preco":69800.0,"pagamento":"Financing"},{"modelo":"Taycan","versao":"Taycan 4S","cidade":"Denver","estado":"CO","ano":2025,"preco":132700.0,"pagamento":"Wire Transfer"},{"modelo":"Panamera","versao":"Panamera","cidade":"Austin","estado":"TX","ano":2021,"preco":81000.0,"pagamento":"Cash"},{"modelo":"911","versao":"911 Turbo S","cidade":"Boston","estado":"MA","ano":2026,"preco":249300.0,"pagamento":"Wire Transfer"},{"modelo":"Cayenne","versao":"Cayenne Coupe","cidade":"Phoenix","estado":"AZ","ano":2024,"preco":108750.0,"pagamento":"Wire Transfer"},{"modelo":"Macan","versao":"Macan Electric","cidade":"Chicago","estado":"IL","ano":2026,"preco":92600.0,"pagamento":"Financing"},{"modelo":"Taycan","versao":"Taycan Turbo","cidade":"Dallas","estado":"TX","ano":2025,"preco":164000.0,"pagamento":"ACH Payment"},{"modelo":"Panamera","versao":"Panamera 4S","cidade":"San Francisco","estado":"CA","ano":2024,"preco":119000.0,"pagamento":"Credit Card"},{"modelo":"911","versao":"911 GT3","cidade":"Las Vegas","estado":"NV","ano":2026,"preco":232500.0,"pagamento":"Wire Transfer"},{"modelo":"Cayenne","versao":"Cayenne E-Hybrid","cidade":"Charlotte","estado":"NC","ano":2023,"preco":96800.0,"pagamento":"Lease"},{"modelo":"Macan","versao":"Macan T","cidade":"Mesa","estado":"AZ","ano":2022,"preco":74400.0,"pagamento":"Cash"},{"modelo":"Taycan","versao":"Taycan GTS","cidade":"Atlanta","estado":"GA","ano":2025,"preco":148500.0,"pagamento":"Crypto Payment"},{"modelo":"718","versao":"718 Boxster","cidade":"Long Beach","estado":"CA","ano":2021,"preco":71900.0,"pagamento":"Bank Transfer"},{"modelo":"911","versao":"911 Targa 4","cidade":"Oakland","estado":"CA","ano":2024,"preco":143250.0,"pagamento":"Financing"},{"modelo":"Panamera","versao":"Panamera Turbo","cidade":"Tulsa","estado":"OK","ano":2020,"preco":137500.0,"pagamento":"Wire Transfer"},{"modelo":"Cayenne","versao":"Cayenne Turbo GT","cidade":"Wichita","estado":"KS","ano":2025,"preco":204800.0,"pagamento":"Credit Card"},{"modelo":"911","versao":"911 Dakar","cidade":"New Orleans","estado":"LA","ano":2024,"preco":271700.0,"pagamento":"Lease"}];

/* ===== ESTADO E FILTROS ===== */
const F = {modelo:"", estado:"", ano:"", pagamento:""};
const LBL = {modelo:"Modelo", estado:"Estado", ano:"Ano-modelo", pagamento:"Pagamento"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => CUR + " " + Math.round(n).toLocaleString("pt-BR");
const short = n => CUR + " " + new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1}).format(n);

function buildFilters(){
  document.getElementById("filters").innerHTML = Object.keys(F).map(k => {
    const vals = [...new Set(rows.map(r => r[k]))].sort((a,b) => k==="ano" ? a-b : String(a).localeCompare(String(b),"pt-BR"));
    return `<label>${LBL[k]}<select data-f="${k}"><option value="">Todos</option>${vals.map(v=>`<option${String(F[k])===String(v)?" selected":""}>${esc(v)}</option>`).join("")}</select></label>`;
  }).join("") + `<button class="btn" id="reset">Limpar filtros</button>`;
}
function group(list, key){ const m = new Map();
  list.forEach(r => { const g = m.get(r[key]) || {k:r[key], sum:0, n:0}; g.sum += r.preco; g.n++; m.set(r[key], g); });
  return [...m.values()]; }
function hbars(id, key, g, total){
  const max = Math.max(...g.map(x => x.sum));
  document.getElementById(id).innerHTML = g.map((x,i) => `<div class="row${i===0?" top":""}" data-k="${key}" data-v="${esc(x.k)}" title="${x.n} vendas"><span class="lb">${esc(x.k)}</span><div class="tr"><div class="fl" style="width:${x.sum/max*100}%"></div></div><span class="val">${short(x.sum)} <small>(${Math.round(x.sum/total*100)}%)</small></span></div>`).join("");
}

function render(){
  const f = rows.filter(r => Object.keys(F).every(k => F[k]==="" || String(r[k])===String(F[k])));
  const kp = document.getElementById("kpis"), ids = ["c1","c2","c3"], ins = ["i1","i2","i3"];
  if (!f.length){ kp.innerHTML = ""; ids.forEach(i => document.getElementById(i).innerHTML = `<div class="empty">Nenhuma venda com esses filtros. Use “Limpar filtros”.</div>`); ins.forEach(i => document.getElementById(i).textContent = ""); return; }
  const total = f.reduce((a,r) => a + r.preco, 0), byM = group(f,"modelo").sort((a,b) => b.sum-a.sum);
  kp.innerHTML = [["Vendas",f.length.toLocaleString("pt-BR")],["Receita",short(total)],["Ticket médio",short(total/f.length)],["Modelo líder",esc(byM[0].k)]]
    .map(([a,b]) => `<div class="kpi"><small>${a}</small><span class="num">${b}</span></div>`).join("");
  // 1) modelos
  hbars("c1","modelo",byM,total);
  const t3 = byM.slice(0,3).reduce((a,x) => a + x.sum, 0);
  document.getElementById("i1").textContent = `${byM[0].k} lidera com ${Math.round(byM[0].sum/total*100)}% da receita; os 3 primeiros somam ${Math.round(t3/total*100)}%.`;
  // 2) anos
  const byY = group(f,"ano").sort((a,b) => a.k-b.k), mx = Math.max(...byY.map(x => x.sum)), best = byY.find(x => x.sum===mx);
  document.getElementById("c2").innerHTML = `<div class="cols">${byY.map(x => `<div class="col${x===best?" top":""}" data-k="ano" data-v="${x.k}" title="${x.n} vendas"><span>${short(x.sum)}</span><i style="height:${x.sum/mx*78}%"></i></div>`).join("")}</div><div class="yrs">${byY.map(x => `<span>${x.k}</span>`).join("")}</div>`;
  const a = byY[0], z = byY[byY.length-1];
  document.getElementById("i2").textContent = byY.length > 1 ? `Melhor ano: ${best.k}. De ${a.k} a ${z.k}, a receita foi de ${short(a.sum)} para ${short(z.sum)}.` : `Só há dados de ${a.k} neste recorte.`;
  // 3) pagamento
  const byP = group(f,"pagamento").sort((a,b) => b.sum-a.sum);
  hbars("c3","pagamento",byP,total);
  document.getElementById("i3").textContent = `${byP[0].k} responde por ${Math.round(byP[0].sum/total*100)}% da receita e ${Math.round(byP[0].n/f.length*100)}% das vendas.`;
  document.getElementById("foot").textContent = `${f.length} de ${rows.length} vendas no recorte.` + (excluded ? ` ${excluded} vendas canceladas ficaram fora da conta.` : "");
}

/* ===== EVENTOS ===== */
document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.f; if (k){ F[k] = e.target.value; render(); } });
document.addEventListener("click", e => {
  if (e.target.id === "reset"){ Object.keys(F).forEach(k => F[k]=""); buildFilters(); render(); return; }
  const el = e.target.closest("[data-k]"); if (!el) return;
  const k = el.dataset.k; F[k] = String(F[k]) === el.dataset.v ? "" : el.dataset.v; buildFilters(); render();
});

rows = DATA; buildFilters(); render();
</script>
</body>
</html>
